<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextavéa Service — Сервис бытовых и клининговых услуг</title>

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&family=Playfair+Display:wght@700&display=swap">

    <!-- Подключение стилей -->
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- Шапка, контент и подвал генерируются в js/app.js -->
    <div id="app"></div>

    <!-- Установка lang для HTML из localStorage -->
    <script>
        const savedLang = localStorage.getItem('app_lang') || 'fr';
        document.documentElement.lang = savedLang;
    </script>

    <!-- Главный скрипт приложения -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
