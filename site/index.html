<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextavéa Service — Сервис бытовых и клининговых услуг</title>

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&family=Playfair+Display:wght@700&display=swap">

    <!--
      Язык и тема выставляются до первой отрисовки.
      Скрипт намеренно встроен и стоит перед стилями: если тему применить
      позже, страница успеет мигнуть светлым фоном.
    -->
    <script>
        (function () {
            try {
                var lang = localStorage.getItem('nx.lang')
                    || localStorage.getItem('app_lang')
                    || 'fr';
                document.documentElement.lang = lang;

                var stored = localStorage.getItem('nx.theme');
                var theme = (stored === 'light' || stored === 'dark')
                    ? stored
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Подключение стилей -->
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- Шапка, контент и подвал генерируются в js/app.js -->
    <div id="app"></div>

    <!-- Главный скрипт приложения -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
