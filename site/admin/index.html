<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Nextavéa Service Operations</title>

    <!-- Same faces as the public site: Montserrat is self-hosted in
         admin.css; Playfair Display and Manrope come from Google Fonts,
         exactly as the public index.html loads them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&family=Playfair+Display:wght@700&display=swap">

    <!--
      Theme is applied before the stylesheet so the page cannot paint light
      and then flip. Inline and synchronous on purpose.
    -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('nx.theme');
                var theme = (stored === 'light' || stored === 'dark')
                    ? stored
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- This page is the console only. Signing in happens on login.html;
         with no key, app.js sends you there before anything renders. -->
    <div id="admin-root" class="admin-root" aria-busy="true">
        <div class="booting">
            <p class="login-kicker">Nextavéa Service</p>
            <p class="booting-line" id="booting-line"></p>
        </div>
    </div>

    <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
